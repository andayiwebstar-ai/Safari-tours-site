<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book your seat | Safari Bus Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2E6CF; --card:#FBF4E4; --ink:#2A1811; --muted:#6B5648; --line:#D9C7A3;
  --accent:#E8643D; --accent-ink:#fff; --sand:#F5C27B; --err:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1E110B;--card:#2A1811;--ink:#F2E6CF;--muted:#B9A58C;--line:#4A3328;--err:#FF8A80;}
}
:root[data-theme="dark"]{--bg:#1E110B;--card:#2A1811;--ink:#F2E6CF;--muted:#B9A58C;--line:#4A3328;--err:#FF8A80;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header svg{flex:none;width:52px;height:52px}
h1{font:400 clamp(24px,6vw,32px)/1.05 "Alfa Slab One",Georgia,serif;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}

/* ticket */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.route{background:var(--ink);color:#F2E6CF;padding:18px 18px 20px}
.seg{display:inline-flex;background:rgba(242,230,207,.12);border-radius:999px;padding:3px;margin-bottom:16px}
.seg label{margin:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg span{display:block;padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.seg input:checked+span{background:var(--sand);color:#2A1811}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.legs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.legs label{color:#CDBBA0;font-weight:500;font-size:13px}
.route select{background:transparent;color:#F2E6CF;border:0;border-bottom:2px solid var(--sand);border-radius:0;padding:6px 0;min-height:44px;font:400 20px "Alfa Slab One",Georgia,serif}
.route select option{color:#2A1811;background:#FBF4E4;font:400 16px "DM Sans",sans-serif}
.swap{width:44px;height:44px;border-radius:50%;border:2px solid var(--sand);background:transparent;color:var(--sand);font-size:20px;cursor:pointer;display:grid;place-items:center;margin-bottom:0}
.swap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.route .err{color:#FFB4A9}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-31px}.perf::after{right:-31px}
form{padding:20px 18px 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.full{grid-column:1/-1}
h2.sec{font:400 17px/1.2 "Alfa Slab One",Georgia,serif;margin:20px 0 12px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.hint{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--err);font-size:13px;margin:4px 0 0}
.bad{border-color:var(--err)!important}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px/1 "DM Sans",sans-serif;cursor:pointer}
.stepper input{text-align:center;width:60px;padding:11px 4px}
.chips{display:flex;gap:8px}
.chips label{flex:1;margin:0;font-weight:500}
.chips input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chips span{display:block;text-align:center;padding:11px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.chips small{display:block;color:var(--muted);font-size:12px}
.chips input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.btn,button.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:700 16px "DM Sans",sans-serif;cursor:pointer;text-decoration:none}
button.primary{width:100%;margin-top:18px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}

/* boarding pass */
.done{display:none}
.pass .route{display:block}
.big{display:flex;align-items:center;justify-content:space-between;gap:10px;font:400 clamp(22px,6vw,30px)/1.1 "Alfa Slab One",Georgia,serif}
.big em{font-style:normal;color:var(--sand);font-size:.8em}
.ref{margin:10px 0 0;color:#CDBBA0;font-size:14px}
.ref b{color:var(--sand)}
dl{margin:0;padding:16px 18px 6px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
dl div{min-width:0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-weight:700;word-break:break-word}
dl .w{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px 18px}
.actions .btn{flex:1 1 150px}
.pass .note{padding:0 18px 18px;margin:0}
@media (max-width:420px){.grid,dl{grid-template-columns:1fr}.legs{grid-template-columns:1fr 1fr}.swap{display:none}.route select{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#2A1811"/><circle cx="50" cy="50" r="42" fill="none" stroke="#E8643D" stroke-width="1.6"/><circle cx="50" cy="26" r="5.5" fill="#F5C27B"/><text x="16" y="70" font-family="Alfa Slab One,Georgia,serif" font-size="46" fill="#E8643D">S</text><text x="48" y="70" font-family="Alfa Slab One,Georgia,serif" font-size="46" fill="#F2E6CF">B</text></svg>
    <div>
      <h1>Safari Bus Kenya</h1>
      <p class="sub">Book your seat.</p>
    </div>
  </header>

  <div class="ticket" id="formcard">
    <form id="f" novalidate>
      <div class="route">
        <div class="seg" role="radiogroup" aria-label="Journey type">
          <label><input type="radio" name="way" value="One way" checked><span>One way</span></label>
          <label><input type="radio" name="way" value="Return"><span>Return</span></label>
        </div>
        <div class="legs">
          <div>
            <label for="from">From</label>
            <select id="from" name="from"></select>
          </div>
          <button type="button" class="swap" id="swap" aria-label="Swap from and to">&#8644;</button>
          <div>
            <label for="to">To</label>
            <select id="to" name="to"></select>
          </div>
        </div>
        <p class="err" id="e-to"></p>
      </div>
      <div class="perf" aria-hidden="true"></div>

      <div style="padding:20px 18px 22px">
        <div class="grid">
          <div>
            <label for="date">Travel date</label>
            <input id="date" name="date" type="date" required>
            <p class="err" id="e-date"></p>
          </div>
          <div id="retbox" hidden>
            <label for="rdate">Return date</label>
            <input id="rdate" name="rdate" type="date">
            <p class="err" id="e-rdate"></p>
          </div>
          <div class="full">
            <label for="time">Departure time</label>
            <select id="time" name="time">
              <option>6:00 AM</option><option>8:00 AM</option><option selected>10:00 AM</option>
              <option>1:00 PM</option><option>4:00 PM</option><option>9:00 PM (night bus)</option>
            </select>
          </div>
        </div>

        <h2 class="sec">Seat type</h2>
        <div class="chips" role="radiogroup" aria-label="Seat type">
          <label><input type="radio" name="seat" value="Standard" checked><span>Standard<small>Comfortable seat</small></span></label>
          <label><input type="radio" name="seat" value="Executive"><span>Executive<small>Extra legroom</small></span></label>
        </div>

        <h2 class="sec">Passengers</h2>
        <div class="grid">
          <div>
            <label for="adults">Adults</label>
            <div class="stepper">
              <button type="button" data-step="-1" data-target="adults" aria-label="Fewer adults">&minus;</button>
              <input id="adults" name="adults" type="number" min="1" max="60" value="1" inputmode="numeric">
              <button type="button" data-step="1" data-target="adults" aria-label="More adults">+</button>
            </div>
          </div>
          <div>
            <label for="kids">Children <span class="hint">(under 12)</span></label>
            <div class="stepper">
              <button type="button" data-step="-1" data-target="kids" aria-label="Fewer children">&minus;</button>
              <input id="kids" name="kids" type="number" min="0" max="60" value="0" inputmode="numeric">
              <button type="button" data-step="1" data-target="kids" aria-label="More children">+</button>
            </div>
          </div>
          <div>
            <label for="bags">Bags</label>
            <div class="stepper">
              <button type="button" data-step="-1" data-target="bags" aria-label="Fewer bags">&minus;</button>
              <input id="bags" name="bags" type="number" min="0" max="30" value="1" inputmode="numeric">
              <button type="button" data-step="1" data-target="bags" aria-label="More bags">+</button>
            </div>
          </div>
        </div>

        <h2 class="sec">Who is travelling</h2>
        <div class="grid">
          <div class="full">
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" required>
            <p class="err" id="e-name"></p>
          </div>
          <div>
            <label for="phone">Phone / WhatsApp</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+254 7XX XXX XXX" required>
            <p class="err" id="e-phone"></p>
          </div>
          <div>
            <label for="email">Email <span class="hint">(optional)</span></label>
            <input id="email" name="email" type="email" autocomplete="email">
            <p class="err" id="e-email"></p>
          </div>
          <div class="full">
            <label for="board">Boarding point <span class="hint">(optional)</span></label>
            <input id="board" name="board" placeholder="Stage, hotel or landmark">
          </div>
          <div class="full">
            <label for="notes">Notes <span class="hint">(optional)</span></label>
            <textarea id="notes" name="notes" placeholder="Seat next to a friend, wheelchair access..."></textarea>
          </div>
        </div>

        <button class="primary" type="submit">Request seat</button>
        <p class="note">We confirm seats and fare by phone or WhatsApp after you send this.</p>
      </div>
    </form>
  </div>

  <div class="ticket pass done" id="done" aria-live="polite" tabindex="-1">
    <div class="route">
      <div class="big"><span id="pf"></span><em>&rarr;</em><span id="pt"></span></div>
      <p class="ref" id="ref"></p>
    </div>
    <div class="perf" aria-hidden="true"></div>
    <dl id="sum"></dl>
    <div class="actions">
      <a class="btn" id="wa" target="_blank" rel="noopener">Send to Safari Bus Kenya on WhatsApp</a>
      <button class="btn alt" id="copy" type="button">Copy details</button>
      <button class="btn alt" id="edit" type="button">Edit booking</button>
    </div>
    <p class="note" id="copied" role="status"></p>
    <p class="note">Tap the WhatsApp button, then press send in WhatsApp so your request reaches us.</p>
  </div>
</div>

<script>
(function(){
  var f=document.getElementById('f'), done=document.getElementById('done'), card=document.getElementById('formcard');
  var from=document.getElementById('from'), to=document.getElementById('to');
  var places=['Nairobi','Mombasa','Nakuru','Naivasha','Narok','Kisumu','Eldoret','Maasai Mara','Amboseli','Tsavo','Samburu','Lake Nakuru NP'];
  places.forEach(function(p,i){
    from.add(new Option(p,p)); to.add(new Option(p,p));
  });
  from.value='Nairobi'; to.value='Maasai Mara';

  document.getElementById('swap').addEventListener('click',function(){var t=from.value;from.value=to.value;to.value=t;});

  var d=document.getElementById('date'), rd=document.getElementById('rdate'), retbox=document.getElementById('retbox');
  var today=new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
  d.min=today.toISOString().slice(0,10); rd.min=d.min;
  d.addEventListener('change',function(){ if(d.value) rd.min=d.value; });
  f.querySelectorAll('input[name=way]').forEach(function(r){
    r.addEventListener('change',function(){ retbox.hidden=f.querySelector('input[name=way]:checked').value!=='Return'; });
  });

  document.querySelectorAll('[data-step]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=document.getElementById(b.dataset.target);
      var min=+i.min||0, max=+i.max||99;
      i.value=Math.max(min,Math.min(max,(+i.value||0)+ +b.dataset.step));
    });
  });

  function setErr(id,msg,field){
    var e=document.getElementById('e-'+id), i=document.getElementById(field||id);
    e.textContent=msg||''; i.classList.toggle('bad',!!msg);
    return !msg;
  }
  function validate(){
    var v=f.elements, ret=f.querySelector('input[name=way]:checked').value==='Return', ok=[];
    ok.push(setErr('to',from.value===to.value?'Choose a different place for From and To.':'','to'));
    ok.push(setErr('date',!v.date.value?'Choose your travel date.':(v.date.value<d.min?'Choose today or a later date.':'')));
    ok.push(setErr('rdate',ret&&(!v.rdate.value||v.rdate.value<v.date.value)?'Choose a return date on or after your travel date.':''));
    ok.push(setErr('name',v.name.value.trim().length<2?'Enter your full name.':''));
    ok.push(setErr('phone',v.phone.value.replace(/\D/g,'').length<9?'Enter a phone number with at least 9 digits.':''));
    ok.push(setErr('email',v.email.value&&!/^\S+@\S+\.\S+$/.test(v.email.value)?'Enter a valid email, like name@example.com.':''));
    return ok.every(Boolean);
  }
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!validate()){var b=f.querySelector('.bad'); if(b) b.focus(); return;}
    show();
  });

  function fmtDate(s){
    var p=s.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  }
  var text='';
  function show(){
    var v=f.elements, ref='SBK-'+Date.now().toString(36).toUpperCase().slice(-6);
    var way=f.querySelector('input[name=way]:checked').value, seat=f.querySelector('input[name=seat]:checked').value;
    var adults=+v.adults.value||1, kids=+v.kids.value||0, bags=+v.bags.value||0;
    var rows=[
      ['Journey',way,0],
      ['Seat',seat,0],
      ['Travel date',fmtDate(v.date.value),0],
      ['Departs',v.time.value,0]
    ];
    if(way==='Return') rows.push(['Return date',fmtDate(v.rdate.value),1]);
    rows.push(['Passengers',adults+(adults===1?' adult':' adults')+(kids?', '+kids+(kids===1?' child':' children'):''),0]);
    rows.push(['Bags',String(bags),0]);
    rows.push(['Name',v.name.value.trim(),0]);
    rows.push(['Phone',v.phone.value.trim(),0]);
    if(v.email.value.trim()) rows.push(['Email',v.email.value.trim(),1]);
    if(v.board.value.trim()) rows.push(['Boarding point',v.board.value.trim(),1]);
    if(v.notes.value.trim()) rows.push(['Notes',v.notes.value.trim(),1]);
    text='Safari Bus Kenya seat request ('+ref+')\n\n'+from.value+' to '+to.value+'\n'+rows.map(function(r){return r[0]+': '+r[1]}).join('\n');
    document.getElementById('pf').textContent=from.value;
    document.getElementById('pt').textContent=to.value;
    document.getElementById('ref').innerHTML='Reference <b></b>';
    document.getElementById('ref').querySelector('b').textContent=ref;
    var dl=document.getElementById('sum'); dl.innerHTML='';
    rows.forEach(function(r){
      var w=document.createElement('div'), t=document.createElement('dt'), dd=document.createElement('dd');
      if(r[2]) w.className='w';
      t.textContent=r[0]; dd.textContent=r[1]; w.appendChild(t); w.appendChild(dd); dl.appendChild(w);
    });
    document.getElementById('wa').href='https://wa.me/254141264347?text='+encodeURIComponent(text);
    document.getElementById('copied').textContent='';
    card.style.display='none'; done.style.display='block'; done.focus(); window.scrollTo(0,0);
    try{window.open(document.getElementById('wa').href,'_blank','noopener');}catch(e){}
  }
  document.getElementById('edit').addEventListener('click',function(){
    done.style.display='none'; card.style.display='block'; window.scrollTo(0,0);
  });
  document.getElementById('copy').addEventListener('click',function(){
    var msg=document.getElementById('copied');
    function ok(){msg.textContent='Copied. Paste it into a WhatsApp message to us.';}
    function fallback(){
      var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
      try{document.execCommand('copy'); ok();}catch(e){msg.textContent='Could not copy. Select the details and copy them by hand.';}
      document.body.removeChild(t);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);}else{fallback();}
  });
})();
</script>
</body>
</html>
